name: shopify-automation

on:
  schedule:
    - cron: "17 14 * * *"     # daily idea list: 14:17 UTC = 10:17 AM New York (EDT), after the 9 AM content-plan research
    - cron: "7 22 * * *"      # daily product photo post: 22:07 UTC = 6:07 PM New York (EDT)
    - cron: "4,24,44 * * * *" # ~every 20 min (off-peak minutes): stays online ~12 min answering Telegram
  workflow_dispatch:
    inputs:
      command:
        description: "trends | poll | photo | photopreview | metacheck | stats | aicheck | test [ranking|story|funny|quiz|tips|explainer]"
        default: "poll"

permissions:
  contents: write              # commit state + store videos as Releases

concurrency:
  group: autopilot             # never run two at once (shared state)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Behaviour: set these under Settings > Secrets and variables > Actions > Variables
      NICHE: ${{ vars.NICHE }}
      REGION: ${{ vars.REGION }}
      LANGUAGE: ${{ vars.LANGUAGE }}
      VOICE: ${{ vars.VOICE }}
      VOICES: ""
      RANKINGS_PER_DAY: ${{ vars.RANKINGS_PER_DAY }}
      VISUALS: ${{ vars.VISUALS }}
      VISUAL_RESEARCH: ${{ vars.VISUAL_RESEARCH }}
      VISUAL_SEARCHES_PER_DAY: ${{ vars.VISUAL_SEARCHES_PER_DAY }}
      VISUAL_CHECK: ${{ vars.VISUAL_CHECK }}
      VISUAL_MIN_SCORE: ${{ vars.VISUAL_MIN_SCORE }}
      CLIPS_PER_DAY: ${{ vars.CLIPS_PER_DAY }}
      CLIP_ORIGINAL_AUDIO: ${{ vars.CLIP_ORIGINAL_AUDIO }}
      CLIP_MAX_SECONDS: ${{ vars.CLIP_MAX_SECONDS }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      MAX_VIDEOS_PER_DAY: ${{ vars.MAX_VIDEOS_PER_DAY || '2' }}
      AUTO_PICK_COUNT: ${{ vars.AUTO_PICK_COUNT || '1' }}
      SELECT_TIMEOUT_HOURS: ${{ vars.SELECT_TIMEOUT_HOURS }}
      REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
      APPROVE_TIMEOUT_HOURS: ${{ vars.APPROVE_TIMEOUT_HOURS }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
      TARGET_SECONDS: ${{ vars.TARGET_SECONDS || '30' }}
      STORE_URL: ${{ vars.STORE_URL }}
      PLAN_ONLY: ${{ vars.PLAN_ONLY }}
      PRODUCT_SHOT_EVERY: ${{ vars.PRODUCT_SHOT_EVERY }}
      PUBLISH_TO: ${{ vars.PUBLISH_TO }}
      FACT_CHECK: ${{ vars.FACT_CHECK }}
      POLL_MINUTES: ${{ vars.POLL_MINUTES }}
      SCHEDULE_PUBLISH: ${{ vars.SCHEDULE_PUBLISH }}
      PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
      PUBLISH_SLOTS_WEEKDAY: "12:15,15:15,19:15,21:15"
      PUBLISH_SLOTS_WEEKEND: "10:15,14:15,19:15,21:15"
      YT_DAILY_UPLOADS: ${{ vars.YT_DAILY_UPLOADS }}
      KEEP_VIDEOS_DAYS: ${{ vars.KEEP_VIDEOS_DAYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg + fonts (if missing)
        timeout-minutes: 15
        run: |
          # apt mirrors occasionally hang; give each try 5 minutes and retry so one stuck mirror can't block the bot
          for i in 1 2 3; do
            if command -v ffmpeg >/dev/null && fc-list | grep -qi "DejaVu Sans"; then break; fi
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-dejavu-core && break
            echo "apt attempt $i failed; retrying"; sleep 10
          done

      - run: pip install -q -r requirements.txt

      - name: Run
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Setup not finished: add TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID and GEMINI_API_KEY secrets (see README). Skipping."; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then CMD="${{ inputs.command }}";
          elif [ "${{ github.event.schedule }}" = "17 14 * * *" ]; then CMD=trends;
          elif [ "${{ github.event.schedule }}" = "7 22 * * *" ]; then CMD=photo;
          else CMD=poll; fi
          echo "Running: $CMD"
          python -m autopilot.main "$CMD"

      - name: Save state
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add state/ archive/ content/ || true
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git pull --rebase && git push)
